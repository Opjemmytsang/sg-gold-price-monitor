<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Singapore Gold Monitor</title>
  <style>
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; background:#f7f3ed; color:#1f1f1f; }
    main { max-width:980px; margin:auto; padding:28px 18px 48px; }
    h1 { margin:0 0 8px; font-size:clamp(28px,5vw,46px); }
    .sub { color:#6f6a63; margin-bottom:22px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
    .card { background:white; border:1px solid #eadfce; border-radius:22px; padding:22px; box-shadow:0 14px 36px rgba(80,55,20,.08); }
    .brand { display:flex; justify-content:space-between; gap:12px; color:#6f6a63; margin-bottom:12px; }
    .badge { border:1px solid #ecd7b3; background:#f5ead8; color:#6e4d1d; border-radius:999px; padding:5px 9px; font-size:12px; }
    .price { font-size:clamp(40px,7vw,64px); font-weight:760; letter-spacing:-.05em; line-height:1; color:#b88a44; margin:8px 0 10px; }
    .unit,.meta { color:#6f6a63; font-size:14px; line-height:1.6; }
    .error .price { color:#b3261e; font-size:28px; letter-spacing:0; }
    .meta { margin-top:22px; }
    table { width:100%; border-collapse:collapse; margin-top:22px; background:white; border-radius:16px; overflow:hidden; }
    th,td { text-align:left; padding:13px; border-bottom:1px solid #eadfce; font-size:14px; }
    th { color:#6f6a63; background:#fff8ea; }
    a { color:#704d1a; }
    button { border:1px solid #eadfce; background:white; border-radius:999px; padding:10px 14px; cursor:pointer; margin-bottom:18px; }
    button:disabled { opacity:.55; cursor:not-allowed; }
  </style>
</head>
<body>
  <main>
    <h1>🇸🇬 Singapore Gold Monitor</h1>
    <div class="sub">Live monitoring of Singapore 24K / 999 gold price per gram</div>
    <button id="refreshBtn" onclick="refreshNow()">Refresh</button>
    <section id="cards" class="grid"></section>
    <div id="meta" class="meta"></div>
    <table>
      <thead><tr><th>Brand</th><th>Item</th><th>Gold Price</th><th>Status</th><th>Source</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
  <script>
    window.SG_GOLD_REFRESH_ENDPOINT = "https://sg-gold-trigger.arwing28.workers.dev";
  </script>
  <script>
    const REFRESH_ENDPOINT = window.SG_GOLD_REFRESH_ENDPOINT || '';
    const money = new Intl.NumberFormat('en-SG', { style:'currency', currency:'SGD', minimumFractionDigits:2 });
    let lastUpdatedAt = '';
    function sgtTime(value){
      if(!value) return 'Not updated';
      const d = new Date(value);
      if(Number.isNaN(d.getTime())) return 'Not updated';
      const parts = new Intl.DateTimeFormat('en-GB', { timeZone:'Asia/Singapore', day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false }).formatToParts(d).reduce((a,p)=>{a[p.type]=p.value; return a;}, {});
      return `${parts.day} ${parts.month} ${parts.year}<br>${parts.hour}:${parts.minute}:${parts.second} (SGT)`;
    }
    function price(item){ return item.status === 'ok' ? `${money.format(item.price)} / gram` : 'Unavailable'; }
    function status(item){ return item.status === 'ok' ? '🟢 Normal' : '🟡 Please check'; }
    function publicLabel(){ return '24K / 999'; }
    function publicUrl(item){ return item.url && item.url !== '#' ? item.url : ''; }
    function displayName(item){
      if(item.id === 'poh-heng-24k-999') return '🟡 Poh Heng';
      if(item.id === 'chow-tai-fook-sg-24k-999') return '🟠 Chow Tai Fook';
      if(item.id === 'lukfook-sg-formula-24k-999') return '💎 Luk Fook Jewellery';
      return item.brand;
    }
    function card(item){
      return `<article class="card ${item.status === 'ok' ? '' : 'error'}"><div class="brand"><strong>${displayName(item)}</strong><span class="badge">${publicLabel(item)}</span></div><div class="price">${item.status === 'ok' ? money.format(item.price) : '—'}</div><div class="unit">${item.status === 'ok' ? '/ gram' : 'Please check gold price setting'}</div></article>`;
    }
    function row(item){ const url = publicUrl(item); return `<tr><td>${displayName(item)}</td><td>${publicLabel(item)}</td><td>${price(item)}</td><td>${status(item)}</td><td>${url ? `<a href="${url}" target="_blank" rel="noopener">Open website</a>` : '—'}</td></tr>`; }
    function setMeta(data, extra=''){
      document.getElementById('meta').innerHTML = `🕒 Last updated<br>${sgtTime(data.updatedAt)}${extra ? `<br><br>${extra}` : ''}`;
    }
    async function load(){
      const res = await fetch(`data/latest.json?ts=${Date.now()}`, { cache:'no-store' });
      const data = await res.json();
      const items = data.items || [];
      lastUpdatedAt = data.updatedAt || '';
      document.getElementById('cards').innerHTML = items.length ? items.map(card).join('') : '<div class="card">No data available.</div>';
      document.getElementById('rows').innerHTML = items.map(row).join('');
      setMeta(data);
      return data;
    }
    async function waitForUpdatedData(previousUpdatedAt){
      const started = Date.now();
      while(Date.now() - started < 180000){
        await new Promise(resolve => setTimeout(resolve, 10000));
        const data = await load();
        if(data.updatedAt && data.updatedAt !== previousUpdatedAt){
          setMeta(data, '✅ Updated');
          return;
        }
        setMeta(data, '⏳ Updating...');
      }
      const data = await load();
      setMeta(data, '⏳ Update triggered. Please press Refresh again later.');
    }
    async function refreshNow(){
      const btn = document.getElementById('refreshBtn');
      const previousUpdatedAt = lastUpdatedAt;
      btn.disabled = true;
      btn.textContent = 'Refreshing...';
      try{
        if(REFRESH_ENDPOINT){
          const response = await fetch(REFRESH_ENDPOINT, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ source:'dashboard' }) });
          if(!response.ok) throw new Error(`Refresh trigger failed: ${response.status}`);
          document.getElementById('meta').innerHTML += '<br><br>⏳ Updating...';
          await waitForUpdatedData(previousUpdatedAt);
        } else {
          await load();
        }
      } catch(error) {
        document.getElementById('meta').innerHTML += `<br><br>🟡 Refresh failed`;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Refresh';
      }
    }
    load().catch(() => { document.getElementById('cards').innerHTML = `<div class="card error"><div class="price">—</div><div class="unit">Unable to load data</div></div>`; });
  </script>
</body>
</html>
