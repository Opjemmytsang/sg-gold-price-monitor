name: Check Singapore 24K Gold Prices

on:
  workflow_dispatch:
    inputs:
      send_quote:
        description: "Send Telegram quote immediately"
        required: false
        default: "true"

permissions:
  contents: write

concurrency:
  group: gold-price-monitor
  cancel-in-progress: false

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium

      - name: Check prices
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          npm run check || echo "Price check returned a non-zero status. Continuing so latest data/status can still be committed."

      - name: Check Luk Fook formula
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node scripts/formula-check.js || echo "Formula check returned a non-zero status. Continuing."

      - name: Send scheduled Telegram quote
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_QUOTE_ALWAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.send_quote == 'true' }}
        run: |
          node scripts/send-scheduled-quote.js || echo "Scheduled quote returned a non-zero status. Continuing."

      - name: Handle Telegram commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node scripts/telegram-commands.js || echo "Telegram command handler returned a non-zero status. Continuing."

      - name: Commit updated data
        run: |
          if [[ -n $(git status --porcelain data/latest.json data/history.json data/telegram-offset.json) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git stash push --include-untracked data/latest.json data/history.json data/telegram-offset.json
            git pull --rebase origin main
            git stash pop || true
            git add data/latest.json data/history.json data/telegram-offset.json
            git commit -m "Update Singapore 24K gold price data" || echo "No commit needed after rebase."
            git push || (git pull --rebase origin main && git push)
          else
            echo "No data changes to commit."
          fi
